<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopPay Prompt</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;padding:20px}
.container{max-width:400px;margin:auto;background:#fff;padding:20px;border-radius:10px}
input,button{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #ccc}
button{background:#16a34a;color:#fff;border:none;font-size:16px}
#result{margin-top:15px;white-space:pre-wrap}
</style>
</head>
<body>

<div class="container">
<h2>ShopPay Prompt</h2>

<input id="phone" placeholder="254796236190">
<input id="amount" type="number" placeholder="5">

<button id="payBtn">Send STK Prompt</button>

<div id="result"></div>
</div>

<script>
document.getElementById("payBtn").addEventListener("click", async () => {
  const phone = document.getElementById("phone").value.trim();
  const amount = document.getElementById("amount").value.trim();
  const result = document.getElementById("result");

  if (!phone || !amount) {
    result.innerText = "Enter phone number and amount.";
    return;
  }

  result.innerText = "Sending STK...";

  try {
    const res = await fetch("/stk", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone, amount })
    });

    const data = await res.json();
    result.innerText = JSON.stringify(data, null, 2);
  } catch (err) {
    result.innerText = "Error: " + err.message;
  }
});
</script>

</body>
</html>
