<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopPay Prompt</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}
body{
  background:#f4f4f4;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
}
.container{
  width:90%;
  max-width:400px;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}
h2{
  text-align:center;
}
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}
button{
  width:100%;
  padding:12px;
  background:#16a34a;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
button:hover{
  background:#15803d;
}
#result{
  margin-top:15px;
  background:#f8f8f8;
  padding:10px;
  border-radius:8px;
  white-space:pre-wrap;
  word-break:break-word;
}
</style>
</head>

<body>

<div class="container">

<h2>ShopPay Prompt</h2>

<input id="phone" type="tel" placeholder="254729029717">

<input id="amount" type="number" placeholder="10">

<button id="payBtn">Send STK Prompt</button>

<div id="result"></div>

</div>

<script>
const payBtn = document.getElementById("payBtn");
const result = document.getElementById("result");

payBtn.addEventListener("click", async () => {

  const phone = document.getElementById("phone").value.trim();
  const amount = document.getElementById("amount").value.trim();

  if (!phone || !amount) {
    result.innerText = "Please enter phone number and amount.";
    return;
  }

  payBtn.disabled = true;
  result.innerText = "Sending STK Prompt...";

  try {

    const response = await fetch("/stk", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        phone,
        amount
      })
    });

    const text = await response.text();

    if (!text) {
      result.innerText = "Server returned an empty response.";
    } else {
      try {
        result.innerText = JSON.stringify(JSON.parse(text), null, 2);
      } catch {
        result.innerText = text;
      }
    }

  } catch (err) {

    result.innerText = "Error: " + err.message;

  }

  payBtn.disabled = false;

});
</script>

</body>
</html>
