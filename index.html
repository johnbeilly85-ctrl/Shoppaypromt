<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopPay Prompt</title>
<style>
body{font-family:Arial;padding:20px;max-width:400px;margin:auto}
input,button{width:100%;padding:14px;margin:8px 0}
button{background:#16a34a;color:white;border:none}
#msg{margin-top:10px}
</style>
</head>
<body>
<h2>ShopPay Prompt</h2>

<input id="phone" placeholder="2547XXXXXXXX">
<input id="amount" type="number" placeholder="Amount">

<button onclick="sendSTK()">Send STK Prompt</button>

<p id="msg"></p>

<script>
async function sendSTK(){
  const phone=document.getElementById("phone").value.trim();
  const amount=document.getElementById("amount").value.trim();

  const res=await fetch("/stkpush",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({phone,amount})
  });

  const data=await res.json();
  document.getElementById("msg").innerText=JSON.stringify(data);
}
</script>
</body>
</html>
